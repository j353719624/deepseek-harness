name: Desktop Nightly

# Sync DeepSeek Harness from upstream, build the unsigned Windows installer,
# and publish it (with electron-updater metadata) to this fork's rolling
# "nightly" release so installed apps can self-update from:
#   https://github.com/<owner>/<repo>/releases/latest/download/nightly.yml
#
# Files this workflow expects in the fork:
#   .github/workflows/desktop-nightly.yml            (this file)
#   .github/workflows/scripts/make-nightly-yml.mjs   (feed metadata generator)

on:
  schedule:
    - cron: '23 */4 * * *' # every 4 hours; note: GitHub disables cron triggers on forks after 60 days without a repo commit — push occasionally or re-enable
  workflow_dispatch:
    inputs:
      force:
        description: 'Build and publish even if the upstream version is unchanged'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-nightly
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/deepseek-ai/deepseek-harness
  PNPM_VERSION: 11.7.0

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Checkout fork (for workflow files)
        uses: actions/checkout@v4

      - name: Stash helper scripts (they must survive the upstream tree swap)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/helpers"
          cp .github/workflows/scripts/make-nightly-yml.mjs "$RUNNER_TEMP/helpers/"

      - name: Fetch upstream master and read version
        shell: bash
        run: |
          git fetch --depth=1 "$UPSTREAM_REPO" master
          UPSTREAM_SHA=$(git rev-parse FETCH_HEAD)
          VERSION=$(git show "$UPSTREAM_SHA:package.json" | sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' | head -1)
          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> "$GITHUB_ENV"
          echo "DSH_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Skip if upstream version already published
        if: inputs.force != true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view nightly --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | grep -q "deepseek-harness-$DSH_VERSION-win-x64.exe"; then
            echo "Version $DSH_VERSION already published; skipping."
            echo "SKIP_BUILD=true" >> "$GITHUB_ENV"
          fi

      - name: Swap working tree to upstream source
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          git checkout --orphan upstream-build
          git rm -rf --quiet . 2>/dev/null || true
          git checkout "$UPSTREAM_SHA" -- .

      - name: Use Node 24
        if: env.SKIP_BUILD != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm via npm (packaging scripts need a JS pnpm entrypoint)
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          npm install -g "pnpm@$PNPM_VERSION"
          PNPM_CJS="$(dirname "$(which pnpm)")/../node_modules/pnpm/bin/pnpm.cjs"
          echo "PNPM_CJS=$PNPM_CJS" >> "$GITHUB_ENV"

      - name: Prepare desktop build env file
        if: env.SKIP_BUILD != 'true'
        shell: bash
        working-directory: apps/desktop
        run: |
          cp .env.windows.example .env.windows
          sed -i 's|^DOWNLOAD_TEST_ORIGIN=$|DOWNLOAD_TEST_ORIGIN=https://dsh-updates.invalid|' .env.windows

      - name: Build and package (retry; runtime asset downloads are transient-flaky and cached)
        if: env.SKIP_BUILD != 'true'
        shell: bash
        env:
          npm_execpath: ${{ env.PNPM_CJS }}
        run: |
          export PATH="/c/Windows/System32:$PATH" # bsdtar must win over GNU tar (drive-letter URLs)
          for attempt in 1 2 3; do
            echo "=== packaging attempt $attempt ==="
            if pnpm run package:desktop:win:x64:unsigned; then
              exit 0
            fi
            echo "attempt $attempt failed; retrying in 30s" >&2
            sleep 30
          done
          exit 1

      - name: Generate electron-updater feed metadata (nightly.yml)
        if: env.SKIP_BUILD != 'true'
        shell: bash
        env:
          FEED_BASE: https://github.com/${{ github.repository }}/releases/latest/download
        run: |
          node "$RUNNER_TEMP/helpers/make-nightly-yml.mjs" \
            "apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/deepseek-harness-$DSH_VERSION-win-x64.exe" \
            "$FEED_BASE/deepseek-harness-$DSH_VERSION-win-x64.exe" \
            nightly.yml

      - name: Publish to rolling "nightly" release
        if: env.SKIP_BUILD != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create nightly --repo "$GITHUB_REPOSITORY" \
            --title "DeepSeek Harness Desktop (nightly)" \
            --notes "Auto-built from upstream deepseek-ai/deepseek-harness@$UPSTREAM_SHA — version $DSH_VERSION." \
            --latest 2>/dev/null || true
          gh release upload nightly --repo "$GITHUB_REPOSITORY" --clobber \
            "apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/deepseek-harness-$DSH_VERSION-win-x64.exe" \
            nightly.yml
          gh release edit nightly --repo "$GITHUB_REPOSITORY" --latest
