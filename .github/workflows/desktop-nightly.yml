name: Desktop Nightly

# Sync DeepSeek Harness from upstream, build the unsigned Windows installer,
# and publish it (with electron-updater metadata) to this fork's rolling
# "nightly" release so installed apps can self-update from:
#   https://github.com/<owner>/<repo>/releases/latest/download/nightly.yml
#
# Files this workflow expects in the fork:
#   .github/workflows/desktop-nightly.yml            (this file)
#   .github/workflows/scripts/make-nightly-yml.mjs   (feed metadata generator)

on:
  schedule:
    - cron: '23 */4 * * *' # every 4 hours; note: GitHub disables cron triggers on forks after 60 days without a repo commit — push occasionally or re-enable
  workflow_dispatch:
    inputs:
      force:
        description: 'Build and publish even if the upstream version is unchanged'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-nightly
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/deepseek-ai/deepseek-harness
  PNPM_VERSION: 11.7.0

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Checkout fork (for workflow files)
        uses: actions/checkout@v4

      - name: Stash helper scripts (they must survive the upstream tree swap)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/helpers"
          cp .github/workflows/scripts/make-nightly-yml.mjs "$RUNNER_TEMP/helpers/"
          cp .github/workflows/scripts/make-black-whale-icon.mjs "$RUNNER_TEMP/helpers/"
          cp .github/workflows/scripts/patch-shell-serving.mjs "$RUNNER_TEMP/helpers/"
          cp .github/workflows/scripts/patch-conversation-width.mjs "$RUNNER_TEMP/helpers/"
          cp .github/workflows/scripts/patch-pi-ai-default-context.mjs "$RUNNER_TEMP/helpers/"
          cp .github/workflows/scripts/patch-profile-health.mjs "$RUNNER_TEMP/helpers/"

      - name: Add boot-time profile health check
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          # The runtime reuses a profile whose node_modules merely EXISTS, so a
          # profile with dangling bundle symlinks (left behind by older installs)
          # boots with zero plugins and silently blocks session creation. Insert
          # a boot-time check that quarantines such profiles so they rebuild.
          node "$RUNNER_TEMP/helpers/patch-profile-health.mjs" apps/desktop/src/main.ts
          cp .github/workflows/scripts/patch-pi-ai-default-context.mjs "$RUNNER_TEMP/helpers/"

      - name: Raise pi-ai fallback context window to 1M
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          # Undeclared models otherwise fall back to 262,144 tokens. GLM-5.3-Flash
          # (the model this deployment talks to) nominally serves a 1M window.
          node "$RUNNER_TEMP/helpers/patch-pi-ai-default-context.mjs" \
            packages/llm/llm-pi-ai/src/config.ts

      - name: Pin conversation width to maximum, drop drag handles
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          # The upstream composer has drag handles on both sides that persist a
          # narrowed content width. Remove the handles and pin the column to the
          # layout maximum; the script fails loudly if the upstream anchor changes.
          node "$RUNNER_TEMP/helpers/patch-conversation-width.mjs" \
            packages/client/ui-conversation/src/client/skeleton

      - name: Patch shell dialog serving (upstream alpha bug)
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          # 0.1.6-alpha.2's protocol handler 404s dsh-app://shell/*, so every shell
          # dialog (check-updates, install confirm, policy login) loads an empty page:
          # the app hangs behind an invisible modal with a blurred main window. Insert
          # the missing `shell` hostname branch; the script fails loudly if the
          # upstream anchor changes.
          node "$RUNNER_TEMP/helpers/patch-shell-serving.mjs" apps/desktop/src/main.ts

      - name: Convert icons to black whale on transparent
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          # Pure Node (zlib only), runs before dependency install. In-place: the same
          # file feeds electron-builder's win icon (.ico for exe/installer) and the
          # packaged resources/icon.png.
          node "$RUNNER_TEMP/helpers/make-black-whale-icon.mjs" \
            apps/desktop/resources/icon-windows.png apps/desktop/resources/icon-windows.png \
            apps/desktop/resources/icon.png apps/desktop/resources/icon.png \
            apps/desktop/resources/icon-macos.png apps/desktop/resources/icon-macos.png

      - name: Fetch upstream master and read version
        shell: bash
        run: |
          git fetch --depth=1 "$UPSTREAM_REPO" master
          UPSTREAM_SHA=$(git rev-parse FETCH_HEAD)
          VERSION=$(git show "$UPSTREAM_SHA:package.json" | sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' | head -1)
          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> "$GITHUB_ENV"
          echo "DSH_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Skip if upstream version already published
        if: inputs.force != true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view nightly --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | grep -q "deepseek-harness-$DSH_VERSION-win-x64.exe"; then
            echo "Version $DSH_VERSION already published; skipping."
            echo "SKIP_BUILD=true" >> "$GITHUB_ENV"
          fi

      - name: Swap working tree to upstream source
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          # Detach HEAD at the upstream commit so the tree (and `git rev-parse HEAD`,
          # which the build bakes into records) reflect real upstream state.
          git checkout --detach "$UPSTREAM_SHA"

      - name: Use Node 24
        if: env.SKIP_BUILD != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm via npm (packaging scripts need a JS pnpm entrypoint)
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          npm install -g "pnpm@$PNPM_VERSION"
          PNPM_CJS="$(dirname "$(which pnpm)")/../node_modules/pnpm/bin/pnpm.cjs"
          echo "PNPM_CJS=$PNPM_CJS" >> "$GITHUB_ENV"

      - name: Prepare desktop build env file
        if: env.SKIP_BUILD != 'true'
        shell: bash
        working-directory: apps/desktop
        run: |
          cp .env.windows.example .env.windows
          sed -i 's|^DOWNLOAD_TEST_ORIGIN=$|DOWNLOAD_TEST_ORIGIN=https://dsh-updates.invalid|' .env.windows
          # Point the mandatory-update policy at an unresolvable .invalid host: DeepSeek's
          # template origins (harness-test.deepseek.com) answer 401 feishu-auth-required,
          # which blocks the app behind an authentication modal no external user can pass.
          # An unreachable origin degrades to a non-blocking "unavailable" policy state.
          sed -i 's|^DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=.*|DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://dsh-updates.invalid|' .env.windows
          sed -i 's|^DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=.*|DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://dsh-updates.invalid|' .env.windows

      - name: Bake self-update feed into the build
        if: env.SKIP_BUILD != 'true'
        shell: bash
        working-directory: apps/desktop
        env:
          DSH_DESKTOP_UPDATE_FEED: https://github.com/${{ github.repository }}/releases/latest/download
        run: |
          # Unsigned builds normally ship without resources/app-update.yml, which keeps
          # the updater disabled. A non-null `publish` makes electron-builder bake the
          # feed into the installer; with no publisherName, electron-updater verifies
          # only the feed's sha512 — so installed apps update straight from this fork.
          # (Unquoted heredoc bakes the URL literally: electron-builder runs in a later
          # step whose env does not include DSH_DESKTOP_UPDATE_FEED.)
          cat > electron-builder.config.mjs <<EOF
          import { createElectronBuilderConfig } from './scripts/electron-builder-config.mjs'

          const config = createElectronBuilderConfig()
          config.publish = [{ provider: 'generic', url: '$DSH_DESKTOP_UPDATE_FEED', channel: 'nightly' }]
          export { createElectronBuilderConfig }
          export default config
          EOF
          echo "=== wrapper electron-builder.config.mjs ==="
          cat electron-builder.config.mjs

      - name: Build and package (retry; runtime asset downloads are transient-flaky and cached)
        if: env.SKIP_BUILD != 'true'
        shell: bash
        env:
          npm_execpath: ${{ env.PNPM_CJS }}
        run: |
          export PATH="/c/Windows/System32:$PATH" # bsdtar must win over GNU tar (drive-letter URLs)
          for attempt in 1 2 3; do
            echo "=== packaging attempt $attempt ==="
            if pnpm run package:desktop:win:x64:unsigned; then
              exit 0
            fi
            echo "attempt $attempt failed; retrying in 30s" >&2
            sleep 30
          done
          exit 1

      - name: Verify baked update feed and icon
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          YML="apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/win-unpacked/resources/app-update.yml"
          test -f "$YML" || { echo "app-update.yml was NOT baked into resources/" ; exit 1 ; }
          echo "=== baked resources/app-update.yml ==="
          cat "$YML"
          node "$RUNNER_TEMP/helpers/make-black-whale-icon.mjs" --verify \
            "apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/win-unpacked/resources/icon.png"
          test -f "apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/.icon-ico/icon.ico" \
            || { echo "installer icon.ico missing" ; exit 1 ; }

      - name: Generate electron-updater feed metadata (nightly.yml)
        if: env.SKIP_BUILD != 'true'
        shell: bash
        env:
          FEED_BASE: https://github.com/${{ github.repository }}/releases/latest/download
        run: |
          node "$RUNNER_TEMP/helpers/make-nightly-yml.mjs" \
            "apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/deepseek-harness-$DSH_VERSION-win-x64.exe" \
            "$FEED_BASE/deepseek-harness-$DSH_VERSION-win-x64.exe" \
            nightly.yml

      - name: Publish to rolling "nightly" release
        if: env.SKIP_BUILD != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create nightly --repo "$GITHUB_REPOSITORY" \
            --title "DeepSeek Harness Desktop (nightly)" \
            --notes "Auto-built from upstream deepseek-ai/deepseek-harness@$UPSTREAM_SHA — version $DSH_VERSION." \
            --latest 2>/dev/null || true
          gh release upload nightly --repo "$GITHUB_REPOSITORY" --clobber \
            "apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/deepseek-harness-$DSH_VERSION-win-x64.exe" \
            nightly.yml
          gh release edit nightly --repo "$GITHUB_REPOSITORY" --latest
